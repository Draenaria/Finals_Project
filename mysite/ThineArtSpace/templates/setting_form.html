{% extends "base.html" %}
{% block "title" %}Setting creation/editing{% endblock%}

{% block "content" %}

<div class="content-section">
    <form method="POST">
    {% csrf_token %}
    {% load crispy_forms_tags %}
        <legend class="border-bottom mb-4">Setting creation/editing</legend>
        {{ form|crispy }}
        <div class="form-group">
            <button class="btn btn-lg btn-primary m-2" type="submit">Save</button>
        </div>
    </form>
</div>
{% endblock %}
